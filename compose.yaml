services:
  database:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ajedrez}
      POSTGRES_USER: ${POSTGRES_USER:-ajedrez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajedrez_local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ajedrez}
      PGUSER: ${POSTGRES_USER:-ajedrez}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ajedrez_local}
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
